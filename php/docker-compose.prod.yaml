services:
  app:
    image: silarhi/php-apache:8.6
    container_name: "${APP_NAME}"
    volumes:
      - ./app:/app:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}.rule=Host(`labs.silarhi.fr`) &&
        (PathPrefix(`/php`) || PathPrefix(`/_errors`))"
      - "traefik.http.routers.${APP_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}.tls=true"
      - "traefik.http.routers.${APP_NAME}.middlewares=${APP_NAME}"
      - "traefik.http.middlewares.${APP_NAME}.stripprefix.prefixes=/php"
    restart: unless-stopped
    networks:
      - web
  app_frankenphp:
    image: silarhi/php-apache:8.5-frankenphp-bookworm
    container_name: "${APP_NAME}-frankenphp"
    volumes:
      - ./app:/app/public:ro
    environment:
      - "CADDY_SERVER_EXTRA_DIRECTIVES=log"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-frankenphp.rule=Host(`labs.silarhi.fr`) &&
        PathPrefix(`/frankenphp`)"
      - "traefik.http.routers.${APP_NAME}-frankenphp.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-frankenphp.tls=true"
      - "traefik.http.routers.${APP_NAME}-frankenphp.middlewares=${APP_NAME}-frankenphp"
      - "traefik.http.middlewares.${APP_NAME}-frankenphp.stripprefix.prefixes=/franken\
        php"
    restart: unless-stopped
    networks:
      - web
networks:
  web:
    external: true
