services:
  esi-php:
    image: silarhi/php-apache:8.5
    container_name: labs-esi-php
    volumes:
      - ./php:/app:ro
    restart: unless-stopped
    networks:
      - default

  varnish:
    image: varnish:8.0-alpine
    container_name: labs-esi-varnish
    command: [ "varnishd", "-F", "-f", "/etc/varnish/default.vcl", "-t", "0" ]
    # The VCL resolves its backend host when it loads: varnishd does not start before esi-php exists
    depends_on:
      - esi-php
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.labs-esi.rule=Host(`labs.silarhi.fr`) &&
        PathPrefix(`/esi`)"
      - "traefik.http.routers.labs-esi.entrypoints=websecure"
      - "traefik.http.routers.labs-esi.tls=true"
      - "traefik.http.routers.labs-esi.middlewares=labs-esi"
      - "traefik.http.middlewares.labs-esi.stripprefix.prefixes=/esi"
    # Check the varnish management process itself (not the backend) — varnishadm
    # ping returns PONG over the local admin socket.
    healthcheck:
      test: ["CMD", "varnishadm", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - web

networks:
  web:
    external: true
